name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The contest engine's guarantees are SQL guarantees: unique indexes are
    # what make scoring idempotent, `for update` is what makes caps hold under
    # concurrency, and window functions produce the ranks a prize depends on.
    # A mocked database would assert that the mock behaves. Without this
    # service those suites skip, and the properties that matter most go
    # unverified on every pull request.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Trust auth rather than a password. The container is ephemeral, bound
          # to the runner, and reachable by nothing else — so a password here
          # secures nothing and is only a credential-shaped string sitting in
          # version control for a scanner to find. Not having one is strictly
          # better than having a well-known one.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The leaderboard cache is the one part of the engine whose behaviour
      # cannot be read off the source — it depends on what the Redis client
      # actually does with ZRANGE … REV and on rename-into-place being atomic
      # for readers.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.12.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
