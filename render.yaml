services:
  - type: web
    name: app-web
    env: node
    # Free instances sleep after inactivity and cold-start on the next request,
    # which is not acceptable for a campus-scale deployment.
    plan: starter
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NEXT_PUBLIC_RELAY_URL
        fromService:
          name: app-relay
          type: web
          property: host
      # Must match CampOS Core's SSO_JWT_SECRET_NADA (or shared fallback) and
      # remain server-side.
      # Render prompts for it during Blueprint setup.
      - key: CAMPOS_SSO_SECRET
        sync: false
      # Public CampOS origin used by the NADA server for the one-time SSO code
      # exchange. The signed identity token never travels in the browser URL.
      - key: CAMPOS_CORE_URL
        value: https://campos-core.vercel.app
      # Public half of the VAPID pair. Must correspond to VAPID_PRIVATE_KEY on
      # the relay, or the browser cannot subscribe to push.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false

  - type: web
    name: app-relay
    env: node
    plan: standard
    # The relay is horizontally scalable: socket presence is shared through
    # Redis pub/sub, so a sender on one instance still reaches a recipient
    # connected to another. Raising this without REDIS_URL set would silently
    # break cross-instance delivery.
    numInstances: 2
    healthCheckPath: /health
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter relay build
    startCommand: pnpm --filter relay start
    envVars:
      - key: ALLOWED_ORIGIN
        fromService:
          name: app-web
          type: web
          property: host
      # Auto-provisioned Postgres (see databases: below). The relay creates its
      # tables on boot, so the Whispers feed persists across restarts with no
      # manual setup.
      - key: DATABASE_URL
        fromDatabase:
          name: nada-db
          property: connectionString
      # Pooled connections per instance. Keep numInstances * DATABASE_POOL_MAX
      # comfortably under the database plan's connection limit.
      - key: DATABASE_POOL_MAX
        value: "10"
      # Required in production: backs the offline envelope queue, the shared
      # rate-limit counters, and cross-instance socket routing. Without it the
      # relay silently degrades to single-instance, in-memory behaviour.
      - key: REDIS_URL
        fromService:
          name: nada-redis
          type: redis
          property: connectionString
      - key: RELAY_QUEUE_TTL_SECONDS
        value: "604800"
      - key: MEDIA_MAX_BYTES
        value: "26214400"
      # ── Media object storage (S3 or any S3-compatible provider, e.g. R2) ────
      # Required in production. Without a bucket the relay falls back to the
      # container filesystem, which is wiped on every deploy and is not shared
      # between instances, so attachments would vanish and 404 at random.
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_REGION
        sync: false
      # Set for S3-compatible providers (R2/MinIO/B2); omit for AWS S3 itself.
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: CAPABILITY_TOKEN_SECRET
        sync: false
      - key: CAPABILITY_ISSUER_SECRET
        sync: false
      # ── Web Push (VAPID) ───────────────────────────────────────────────────
      # Generate with: npx web-push generate-vapid-keys
      # Without these the relay accepts push subscriptions but never sends a
      # notification, so clients fall back to polling for everything.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # ── WebRTC TURN (Metered) — set USERNAME + CREDENTIAL in Render dashboard.
      # Credentials are issued via /api/v1/turn/credentials only after the
      # client proves it owns the requesting pubkey, so they are no longer
      # bundled into the web app's JS.
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_URLS
        sync: false
      - key: ZERO_LOG_MODE
        value: "true"

  # Shared Redis. Three jobs, all of which must be shared across instances:
  # the durable offline-envelope queue, rate-limit counters, and the pub/sub
  # channels that let any instance deliver to a socket held by another.
  - type: redis
    name: nada-redis
    plan: starter
    # Queued envelopes are durable data with their own TTL — evicting them
    # under memory pressure would silently drop undelivered messages.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed Postgres backing the relay (Whispers feed, statuses, monetization).
  # The free plan expires and caps connections; production needs a paid plan
  # with headroom for numInstances * DATABASE_POOL_MAX connections.
  - name: nada-db
    plan: basic-256mb
